spring.application.name=course-platform

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/courses}
spring.datasource.username=${DB_USERNAME:courses}
spring.datasource.password=${DB_PASSWORD:courses}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:courses}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:courses}