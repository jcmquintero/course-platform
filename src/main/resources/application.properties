spring.application.name=course-platform

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/courses}
spring.datasource.username=${DB_USERNAME:courses}
spring.datasource.password=${DB_PASSWORD:courses}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:courses}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:courses}
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1000ms
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.retry.max-interval=5000ms
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# Security
security.jwt.secret=${JWT_SECRET}
security.jwt.expiration=3600

# Metrics and Health
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when-authorized

management.info.env.enabled=true
info.app.name=course-platform
info.app.description=Online course platform
info.app.version=1.0

